[build-system]
# license = "..." below is the PEP 639 SPDX-string form, which setuptools
# only understands from 77 onward; a build environment resolving an older
# setuptools fails or silently drops the license metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyguitest"
# The version lives in src/pyguitest/__init__.py and is read from there, so
# `pyguitest.__version__`, the wheel and the `--version` flag cannot disagree.
# setuptools parses that assignment statically; it does not import the package.
dynamic = ["version"]
description = "Cross-platform GUI automation; successor to X11::GUITest"
# 3.9 reached end-of-life in October 2025; 3.10 is the oldest
# version still receiving security fixes.
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [{name = "Dennis K. Paulsen"}]
readme = "README.md"
keywords = ["gui-automation", "testing", "x11", "wayland", "accessibility", "atspi"]

# No `License ::` classifier: with the PEP 639 `license` SPDX string above,
# setuptools>=77 rejects the distribution if both are present.
classifiers = [
    # Every capability is implemented and the API is settled enough to use,
    # but docs/validation.md still lists paths not yet run against the real
    # thing -- that is 4-Beta, not 5-Production/Stable.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: X11 Applications",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    # PEP 561: py.typed is shipped, so annotations are usable downstream.
    "Typing :: Typed",
]

# No hard dependencies by design. Every display-server mechanism is probed at
# runtime and degrades to an unsupported capability rather than an import error,
# because no single set of bindings is present across GNOME, KDE, wlroots, X11,
# and the BSDs. See docs/wayland-audit.html.
dependencies = []

# Rationale for each choice is in docs/adr-001-dependencies.md.
# Input injection and screen capture deliberately have NO Python dependency --
# they adapt maintained command-line tools (wdotool, wtype, grim, swaymsg)
# through subprocess instead. See src/pyguitest/tools.py.
# End users get a `pyguitest` command; no need for `python -m`.
[project.scripts]
pyguitest = "pyguitest.__main__:main"

[project.optional-dependencies]
atspi = ["dogtail>=2.0"]        # element automation. NB: dogtail declares no
                                # deps; PyGObject + pyatspi must come from
                                # the distro. See README INSTALL.
x11   = ["python-xlib>=0.33"]   # X11 backend, incl. FreeBSD/Solaris
uinput = ["evdev>=1.9"]         # last-resort input where no tool is installed
eiinput = ["python-libei[portal]>=0.3.0"]
                                   # libei input backend (opt-in). The
                                   # [portal] extra is PyGObject, which
                                   # libei.portal needs to negotiate the
                                   # RemoteDesktop session -- previously this
                                   # backend needed it directly and never
                                   # declared it, so `pip install
                                   # pyguitest[eiinput]` alone produced a
                                   # backend that failed at construction
                                   # unless the atspi extra happened to have
                                   # pulled PyGObject in. Needs the native
                                   # libei library from the distro too; pip
                                   # cannot supply that. See README.
dev   = ["pytest>=7", "ruff>=0.6", "mypy>=1.11",
         "python-dbusmock>=0.30"]  # tests/test_portal_dbusmock.py: PortalBackend
                                   # against a real, private D-Bus session bus.
                                   # Also needs dbus-python and real PyGObject
                                   # (the atspi extra's PyGObject dependency,
                                   # already required to use PortalBackend at
                                   # all) and a `dbus-daemon` binary on PATH;
                                   # the test skips itself if any are missing.

[project.urls]
homepage = "https://github.com/ctrondlp/pyguitest"
repository = "https://github.com/ctrondlp/pyguitest"
issues = "https://github.com/ctrondlp/pyguitest/issues"
documentation = "https://github.com/ctrondlp/pyguitest/tree/main/docs"
changelog = "https://github.com/ctrondlp/pyguitest/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "pyguitest.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: ship the marker so type checkers use our annotations. The KWin
# script: KWinEventsBackend loads it via importlib.resources at runtime, so
# it has to actually be in the installed package, not just the source tree.
[tool.setuptools.package-data]
pyguitest = ["py.typed"]
"pyguitest.backends" = ["_kwin_window_events.js"]


# --------------------------------------------------------------------------
# Linting and formatting: ruff covers both, so there is one tool and one
# config rather than black + isort + flake8 + pydocstyle.
#
#   ruff check src tests        report problems
#   ruff check --fix src tests  fix what is mechanical
#   ruff format src tests       apply the formatting
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "D",        # pydocstyle
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplification
    "RET",      # return consistency
    "ARG",      # unused arguments
    "C901",     # cyclomatic complexity
]
ignore = [
    "D203",    # incompatible with D211; keep no blank line before class docstring
    "D213",    # incompatible with D212; keep the summary on the first line
    "D401",    # properties read better as noun phrases than imperatives
    "B027",    # GUIBackend.close is an intentional optional hook, not abstract
    "D105",    # __enter__/__exit__ and friends document themselves
]

[tool.ruff.lint.mccabe]
# A ceiling on what gets added, not a claim the tree is already under it.
# 15 clears everything except send_keys (26), the hand-written X11::GUITest
# key-string tokenizer -- the one function this is meant to catch, left
# failing on purpose rather than suppressed. Ratchet down as it is split.
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# The backend interface exists to be overridden: its stubs necessarily accept
# arguments they do not use.
"src/pyguitest/backends/base.py" = ["ARG002"]
# Backends legitimately ignore arguments other backends need -- a screen index
# is meaningless where there is one output.
"src/pyguitest/backends/*.py" = ["ARG002", "ARG005"]
# Backend factories share one signature; not all of them need the
# environment to decide.
"src/pyguitest/backends/__init__.py" = ["ARG001", "ARG002"]
# Tests use fakes with deliberately unused arguments and bare attribute access
# to assert that lookups raise.
"tests/*" = [
    "ARG001", "ARG002", "ARG003", "ARG005",  # fakes accept arguments they ignore
    "B018",                        # bare attribute access asserts a raise
    "SIM117",                      # nested with-blocks read better in tests
    "D100", "D101", "D102", "D103", "D104", "D107",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.mypy]
files = ["src/pyguitest"]
python_version = "3.10"
# Optional backends import libraries that may not be installed; their absence
# is a runtime condition this package handles, not a typing error.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
# Without this, a function with even one annotated parameter or return type
# has its BODY skipped entirely -- "mypy clean" was true of files that were
# mostly unchecked. On by default now that the backlog it uncovered (32
# errors, mostly Optional attributes narrowed in one method but used in
# another) is fixed; keep it on so that gap cannot quietly reopen.
check_untyped_defs = true
