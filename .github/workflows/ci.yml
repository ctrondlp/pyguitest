# The suite needs no dependencies and no display: every test imports only the
# standard library, because every display-server mechanism this package
# drives is probed at runtime and stands in as a fake under test. That is
# what makes the matrix below cheap enough to run on every push.
#
# It is also the reason CI matters here more than usual. Almost nothing in
# this package can be exercised against the real thing in an automated
# environment -- there is no compositor, no session bus, no X server, no
# consent dialog anyone can click -- so the tests drive stand-ins for
# python-xlib, Gio and the portal. Stand-ins drift. Running them on every
# supported Python is the cheapest guard against that drift going unnoticed.

name: CI

on:
  push:
    branches: [main]
    # Release tags. Without this a `git push origin v0.1.0` triggers no
    # workflow at all, so the publish job below would never run.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, and the compositor job below is why: it is the one job here
    # that has never run on a GitHub runner, so it needs somewhere to fail
    # that is not somebody's pull request.
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Deliberately no `pip install`. The package declares no hard
      # dependencies, and the suite passes with nothing installed and no
      # capture or input tool on PATH -- so running it bare is not a
      # shortcut, it is the claim under test. An install step here would
      # hide a stray `import` creeping into a module that must stay
      # importable on a machine with none of the optional extras.
      - name: Run the test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The floor, not the newest: ruff and mypy are both configured
          # for py310, and type errors that only appear on the oldest
          # supported version are exactly the ones worth catching.
          python-version: "3.10"

      - run: pip install ruff mypy

      # examples/ and scripts/ are linted too, not just the package. They
      # are the code a reader copies from, and being outside this check is
      # how scripts/diagnose-x11-capture.py drifted out of format without
      # anything noticing.
      - run: ruff check src tests examples scripts
      - run: ruff format --check src tests examples scripts

      # Type-checks src/pyguitest per [tool.mypy] in pyproject.toml.
      # ignore_missing_imports is set there because the optional backends
      # import libraries that may not be installed -- their absence is a
      # runtime condition this package handles, not a typing error.
      - run: mypy

  imagemagick:
    name: image search against real ImageMagick
    runs-on: ubuntu-latest
    # The other half of what cannot be faked. tests/test_imagesearch.py
    # mocks the runner everywhere else, so it checks the command line and
    # the output parsing but never that the numbers mean what locate()
    # claims -- in particular that a region search adds the crop's offset
    # back, arithmetic a mocked test cannot confirm. The images are
    # generated by png.py at run time, so this also puts that encoder in
    # front of a real decoder.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

      # Same reasoning as the portal job: these tests skip themselves when
      # ImageMagick is absent, which is right on a laptop and wrong here.
      - name: Run the image-search tests
        env:
          PYTHONPATH: src
        run: |
          set -eo pipefail
          output=$(python -m unittest discover -s tests \
              -p test_imagesearch.py -v 2>&1) || status=$?
          echo "$output"
          if [ -n "${status:-}" ]; then
            exit "$status"
          fi
          if echo "$output" | grep -q "skipped"; then
            echo "::error::the ImageMagick tests skipped themselves, so this"
            echo "::error::job proved nothing -- imagemagick did not install."
            exit 1
          fi

  portal:
    name: portal against a real D-Bus session
    runs-on: ubuntu-latest
    # The one thing that can be exercised for real in CI. Everything else
    # needs a compositor or a human; a private D-Bus session bus does not,
    # and PortalBackend's negotiation is where a live bug was found before
    # (a missing session_handle_token crashed xdg-desktop-portal outright).
    # These tests skip themselves if anything is missing, so this job is
    # only meaningful with the system packages below -- dbus-python needs
    # compiling and dbus-daemon is a binary, so neither comes from pip.
    steps:
      - uses: actions/checkout@v5

      - name: Install python-dbusmock, dbus-python and dbus-daemon
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-dbusmock python3-dbus python3-gi dbus

      # The system python3, not setup-python: the packages above are
      # installed for it, and a setup-python interpreter cannot see them.
      #
      # The run is captured rather than streamed because a *skip* has to
      # fail this job. These tests skip themselves when dbusmock, dbus or
      # PyGObject are missing, which is right when someone runs them on a
      # laptop and wrong here -- a green job that silently proved nothing
      # is worse than a red one. Captured once and inspected, not run
      # twice.
      #
      # `discover -p`, never the dotted module name: there is no
      # tests/__init__.py, and while 3.13 resolves that name as a
      # namespace package, 3.14 fails with ModuleNotFoundError, which
      # reads like a missing file rather than a bad invocation.
      - name: Run the D-Bus tests
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          output=$(python3 -m unittest discover -s tests \
              -p test_portal_dbusmock.py -v 2>&1) || status=$?
          echo "$output"
          if [ -n "${status:-}" ]; then
            exit "$status"
          fi
          if echo "$output" | grep -q "skipped"; then
            echo "::error::the dbusmock tests skipped themselves, so this"
            echo "::error::job proved nothing -- the apt packages above"
            echo "::error::did not land for the system python3."
            exit 1
          fi

  compositor:
    name: the COMPOSITOR tier, in a headless GNOME session
    runs-on: ubuntu-latest
    # Everything else in this file works because it needs no compositor.
    # This one is the opposite: window control, window capture and window
    # events cannot be faked, and until now every claim about them in
    # docs/validation.md came from a person watching a screen.
    # `gnome-shell --headless --virtual-monitor` is a full Mutter with no
    # output attached, so scripts/headless-session.sh can run the same
    # validation unattended. It passes on a Fedora 45 developer machine.
    #
    # NOT on pushes or pull requests, deliberately. Whether a GitHub runner
    # can host it at all is untested -- headless mode needs no DRM master,
    # which is the part that mattered locally, but a runner also has no
    # logind session, and the local run registered with GDM and monitored
    # one. So this is dispatch-and-nightly until it has a track record;
    # move it into `needs` for `publish` once it has one.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5

      # gnome-shell brings Mutter and the `gnome-extensions` CLI; dbus
      # brings dbus-run-session, libglib2.0-bin brings gdbus and
      # gsettings, and the GTK4 introspection data is for
      # scripts/probe-window.py, which supplies the window the geometry
      # checks point at.
      - name: Install GNOME Shell and the tools the script needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell dbus libglib2.0-bin python3-gi gir1.2-gtk-4.0 \
            gnome-shell-extension-prefs

      # Two steps, and the order matters: the shell reads its enabled
      # extensions at startup, so enabling has to happen before
      # headless-session.sh launches it. `--install` only copies files and
      # exits.
      - name: Install and enable the window-control extension
        run: |
          ./scripts/validate-gnome-extension.sh --install
          # Inside a session bus of its own: `gnome-extensions enable`
          # writes a GSettings key, dconf needs a bus to write it, and a
          # runner has none. Written to ~/.config/dconf/user, which the
          # shell started below reads at startup like any other session.
          dbus-run-session -- \
            gnome-extensions enable pyguitest-window-control@pyguitest.local

      # Captured rather than streamed for the same reason as the portal and
      # ImageMagick jobs above: this script exits 0 when it decides there
      # is nothing to check, and a job that proved nothing must not be
      # green. "move/resize compose correctly" is the line that only
      # appears once the backend battery has actually run against a real
      # window.
      - name: Run the extension validation inside a headless session
        run: |
          set -o pipefail
          output=$(./scripts/headless-session.sh --timeout 90 \
              --log shell.log \
              ./scripts/validate-gnome-extension.sh 2>&1) || status=$?
          echo "$output"
          # The shell's own log, kept via --log rather than discarded, is
          # where the extension's capture diagnostics land -- the four
          # rects that explain a crop coming out the wrong size. Only
          # printed on failure, where it is the whole point.
          if [ -n "${status:-}" ]; then
            echo "----- gnome-shell log -----"
            grep -i "pyguitest" shell.log || tail -n 60 shell.log
            exit "$status"
          fi
          if ! echo "$output" | grep -q "move/resize compose correctly"; then
            echo "::error::the backend battery never ran, so this job proved"
            echo "::error::nothing -- the shell, the extension or the probe"
            echo "::error::window did not come up. See the output above."
            exit 1
          fi

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install build twine
      - run: python -m build

      # A PyPI version number can never be reused, so a tag disagreeing with
      # the packaged version has to fail here rather than ship. Read back out
      # of the built artifact, not out of the source, so it checks what would
      # actually be uploaded. Skipped on branch pushes, where there is no tag.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/pyguitest-(.+)\.tar\.gz|\1|')
          echo "tag=$tag packaged=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the packaged"
            echo "::error::version $built -- fix __version__ in"
            echo "::error::src/pyguitest/__init__.py or retag."
            exit 1
          fi

      # Catches a README that renders on GitHub but not on PyPI, which is
      # otherwise only discovered once the upload is already permanent.
      - run: python -m twine check --strict dist/*

      # The sdist ships tests/, and tests/test_docs.py reads docs/install.md
      # and docs/input.md -- so a packager building from the sdist and running
      # the suite, which is what Fedora and Debian do, needs docs/ inside it.
      # That is what MANIFEST.in is for; this asserts it kept working.
      - name: The sdist must be self-testing
        run: |
          set -eu
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/pyguitest-*
          PYTHONPATH=src python -m unittest discover -s tests -v

      # Handed to the publish job below rather than rebuilt there, so what
      # reaches PyPI is byte-for-byte what twine just checked.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishes to PyPI on a v* tag via Trusted Publishing (OIDC): PyPI is
  # configured to trust this repo/workflow/environment, so there is no API
  # token in secrets to leak or rotate. `id-token: write` is what lets the
  # runner mint the short-lived credential; the action does the rest.
  #
  # Requires one-time setup on pypi.org first -- see "Releasing" in
  # CONTRIBUTING.md. Until that exists, a tag push fails here rather than
  # silently publishing nothing.
  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, lint, imagemagick, portal, build]
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI publisher config. A
    # required reviewer on it makes each publish a deliberate approval
    # rather than a side effect of pushing a tag.
    environment:
      name: pypi
      url: https://pypi.org/p/pyguitest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
