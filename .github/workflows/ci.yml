# The suite needs no dependencies and no display: every test imports only the
# standard library, because every display-server mechanism this package
# drives is probed at runtime and stands in as a fake under test. That is
# what makes the matrix below cheap enough to run on every push.
#
# It is also the reason CI matters here more than usual. Almost nothing in
# this package can be exercised against the real thing in an automated
# environment -- there is no compositor, no session bus, no X server, no
# consent dialog anyone can click -- so the tests drive stand-ins for
# python-xlib, Gio and the portal. Stand-ins drift. Running them on every
# supported Python is the cheapest guard against that drift going unnoticed.

name: CI

on:
  push:
    branches: [main]
    # Release tags. Without this a `git push origin v0.1.0` triggers no
    # workflow at all, so the publish job below would never run.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, and the compositor job below is why: it is the one job here
    # that has never run on a GitHub runner, so it needs somewhere to fail
    # that is not somebody's pull request.
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Deliberately no `pip install`. The package declares no hard
      # dependencies, and the suite passes with nothing installed and no
      # capture or input tool on PATH -- so running it bare is not a
      # shortcut, it is the claim under test. An install step here would
      # hide a stray `import` creeping into a module that must stay
      # importable on a machine with none of the optional extras.
      - name: Run the test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The floor, not the newest: ruff and mypy are both configured
          # for py310, and type errors that only appear on the oldest
          # supported version are exactly the ones worth catching.
          python-version: "3.10"

      - run: pip install ruff mypy

      # examples/ and scripts/ are linted too, not just the package. They
      # are the code a reader copies from, and being outside this check is
      # how scripts/diagnose-x11-capture.py drifted out of format without
      # anything noticing.
      - run: ruff check src tests examples scripts
      # `docs` is in the format check and not the lint one, deliberately.
      # ruff formats the python blocks inside the markdown, and those are the
      # snippets a reader copies and runs -- a block that does not match the
      # project's own formatting was a block nobody had run. It is *not* in
      # `ruff check`, because documentation snippets are fragments: they name
      # undefined variables and omit imports on purpose, and linting them
      # would fail for everything that makes them readable. Added after a
      # wait_for_process example drifted out of format with CI green, since
      # the paths listed here were the only ones checked.
      - run: ruff format --check src tests examples scripts docs

      # Type-checks src/pyguitest per [tool.mypy] in pyproject.toml.
      # ignore_missing_imports is set there because the optional backends
      # import libraries that may not be installed -- their absence is a
      # runtime condition this package handles, not a typing error.
      - run: mypy

  imagemagick:
    name: image search against real ImageMagick
    runs-on: ubuntu-latest
    # The other half of what cannot be faked. tests/test_imagesearch.py
    # mocks the runner everywhere else, so it checks the command line and
    # the output parsing but never that the numbers mean what locate()
    # claims -- in particular that a region search adds the crop's offset
    # back, arithmetic a mocked test cannot confirm. The images are
    # generated by png.py at run time, so this also puts that encoder in
    # front of a real decoder.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

      # Same reasoning as the portal job: these tests skip themselves when
      # ImageMagick is absent, which is right on a laptop and wrong here.
      - name: Run the image-search tests
        env:
          PYTHONPATH: src
        run: |
          set -eo pipefail
          output=$(python -m unittest discover -s tests \
              -p test_imagesearch.py -v 2>&1) || status=$?
          echo "$output"
          if [ -n "${status:-}" ]; then
            exit "$status"
          fi
          if echo "$output" | grep -q "skipped"; then
            echo "::error::the ImageMagick tests skipped themselves, so this"
            echo "::error::job proved nothing -- imagemagick did not install."
            exit 1
          fi

  portal:
    name: portal against a real D-Bus session
    runs-on: ubuntu-latest
    # The one thing that can be exercised for real in CI. Everything else
    # needs a compositor or a user; a private D-Bus session bus does not,
    # and PortalBackend's negotiation is where a live bug was found before
    # (a missing session_handle_token crashed xdg-desktop-portal outright).
    # These tests skip themselves if anything is missing, so this job is
    # only meaningful with the system packages below -- dbus-python needs
    # compiling and dbus-daemon is a binary, so neither comes from pip.
    steps:
      - uses: actions/checkout@v5

      - name: Install python-dbusmock, dbus-python and dbus-daemon
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-dbusmock python3-dbus python3-gi dbus

      # The system python3, not setup-python: the packages above are
      # installed for it, and a setup-python interpreter cannot see them.
      #
      # The run is captured rather than streamed because a *skip* has to
      # fail this job. These tests skip themselves when dbusmock, dbus or
      # PyGObject are missing, which is right when someone runs them on a
      # laptop and wrong here -- a green job that silently proved nothing
      # is worse than a red one. Captured once and inspected, not run
      # twice.
      #
      # `discover -p`, never the dotted module name: there is no
      # tests/__init__.py, and while 3.13 resolves that name as a
      # namespace package, 3.14 fails with ModuleNotFoundError, which
      # reads like a missing file rather than a bad invocation.
      - name: Run the D-Bus tests
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          output=$(python3 -m unittest discover -s tests \
              -p test_portal_dbusmock.py -v 2>&1) || status=$?
          echo "$output"
          if [ -n "${status:-}" ]; then
            exit "$status"
          fi
          if echo "$output" | grep -q "skipped"; then
            echo "::error::the dbusmock tests skipped themselves, so this"
            echo "::error::job proved nothing -- the apt packages above"
            echo "::error::did not land for the system python3."
            exit 1
          fi

  compositor:
    name: the COMPOSITOR tier, in a headless GNOME session
    runs-on: ubuntu-latest
    # Everything else in this file works because it needs no compositor.
    # This one is the opposite: window control, window capture and window
    # events cannot be faked, and until now every claim about them in
    # docs/validation.md came from a person watching a screen.
    # `gnome-shell --headless --virtual-monitor` is a full Mutter with no
    # output attached, so scripts/headless-session.sh can run the same
    # validation unattended. It passes on a Fedora 45 developer machine.
    #
    # Runs on pushes to main now, having earned it: a runner hosts the
    # headless shell without complaint, and the job found two real bugs
    # this desktop structurally could not -- the runner is GNOME Shell 46
    # and a developer machine is 51, and the two capture paths are split
    # by exactly that version, so neither can execute the other's code.
    #
    # Not on pull requests, which is the one exclusion: five minutes of
    # apt on every PR is a poor trade, and main catches it either way. The
    # earlier gate (dispatch and nightly only) is what made a green badge
    # misleading -- the job it skipped was the interesting one.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      # gnome-shell brings Mutter and the `gnome-extensions` CLI; dbus
      # brings dbus-run-session, libglib2.0-bin brings gdbus and
      # gsettings, and the GTK4 introspection data is for
      # scripts/probe-window.py, which supplies the window the geometry
      # checks point at.
      - name: Install GNOME Shell and the tools the script needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell dbus libglib2.0-bin python3-gi gir1.2-gtk-4.0

      # Two steps, and the order matters: the shell reads its enabled
      # extensions at startup, so enabling has to happen before
      # headless-session.sh launches it. `--install` only copies files and
      # exits.
      - name: Install and enable the window-control extension
        run: |
          ./scripts/validate-gnome-extension.sh --install
          # Inside a session bus of its own: `gnome-extensions enable`
          # writes a GSettings key, dconf needs a bus to write it, and a
          # runner has none. Written to ~/.config/dconf/user, which the
          # shell started below reads at startup like any other session.
          dbus-run-session -- \
            gnome-extensions enable pyguitest-window-control@pyguitest.local

      # Captured rather than streamed for the same reason as the portal and
      # ImageMagick jobs above: this script exits 0 when it decides there
      # is nothing to check, and a job that proved nothing must not be
      # green. "move/resize compose correctly" is the line that only
      # appears once the backend battery has actually run against a real
      # window.
      - name: Run the extension validation inside a headless session
        run: |
          set -o pipefail
          output=$(./scripts/headless-session.sh --timeout 90 \
              --log shell.log \
              ./scripts/validate-gnome-extension.sh 2>&1) || status=$?
          echo "$output"
          # The shell's own log, kept via --log rather than discarded, is
          # where the extension's capture diagnostics land -- the four
          # rects that explain a crop coming out the wrong size. Only
          # printed on failure, where it is the whole point.
          if [ -n "${status:-}" ]; then
            echo "----- gnome-shell log -----"
            grep -i "pyguitest" shell.log || tail -n 60 shell.log
            exit "$status"
          fi
          if ! echo "$output" | grep -q "move/resize compose correctly"; then
            echo "::error::the backend battery never ran, so this job proved"
            echo "::error::nothing -- the shell, the extension or the probe"
            echo "::error::window did not come up. See the output above."
            exit 1
          fi

  windows:
    name: Windows collection and the fake-driven tests
    runs-on: windows-latest
    # The machine-free half of the Windows work lands before there is anything
    # Windows-specific to break, which is the whole point of this job: an
    # import-time failure in a Linux-only module is the likeliest first
    # surprise -- a module-scope `import grp` was exactly that -- and it is
    # invisible on every other runner here. Nothing needs installing, and
    # nothing on this runner can drive a desktop, so what it proves is narrower
    # than the other jobs' claims: that every test module imports, that the
    # suite collects, and that the tests written to run anywhere pass there.
    #
    # This job was `continue-on-error: true` while the Linux-only tests still
    # needed their guards -- a red run being a finding to collect rather than
    # a broken build -- and it was left out of `publish`'s needs for the same
    # reason. Both have been paid off: the guards landed (the real-`ps` route,
    # and the Linux capture and clipboard routes, each pinned so the Windows
    # branch cannot mask them), the full suite has since run green on a real
    # Windows 11 box, and this job is green on main. An advisory job that
    # nothing can fail is indistinguishable from no job at all once the thing
    # it watches for works, so it is a gate now, and in `publish`'s needs.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # One version rather than the whole matrix: this job is about the
          # platform, and the Python-to-Python differences are the `tests`
          # job's business.
          python-version: "3.12"

      - name: Run the suite, and check that the Linux-only tests skipped
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -eo pipefail
          python - <<'PY'
          import sys
          import unittest

          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.TestLoader().discover("tests")
          )
          skipped = len(result.skipped)
          print(
              f"\nran {result.testsRun}, skipped {skipped}, "
              f"failures {len(result.failures)}, errors {len(result.errors)}"
          )
          if result.failures or result.errors:
              sys.exit(1)
          # A floor rather than a target: a mass import failure would otherwise
          # look like a suite that quietly ran almost nothing.
          if result.testsRun < 800:
              sys.exit(f"only {result.testsRun} tests ran -- something did not import")
          # The X11, AT-SPI, D-Bus and portal tests have to skip *loudly* on a
          # machine that has none of them. Zero skips does not mean "everything
          # works here", it means their guards never fired -- which reads as
          # support for a platform that has not been tested at all.
          if skipped < 10:
              sys.exit(f"only {skipped} tests skipped -- the Linux-only guards did not run")
          PY

  macos:
    name: macOS, where Darwin is the host rather than a mock
    runs-on: macos-latest
    # macOS support was written from documentation on a Windows machine, with
    # every test driving a fake `Quartz` in `sys.modules` and a patched
    # `_macapi`. There is exactly one claim such a suite cannot check: that
    # the Darwin branch of `detect()` is the branch a real Mac takes. That is
    # what this job is for, and it is why it runs the suite *and* a probe --
    # the suite alone passes on this runner for the same reason it passes on
    # the other two, with every platform-specific test patching the platform
    # it is about.
    #
    # What the probe adds is the opposite of a patch: `sys.platform` is
    # `"darwin"` because the machine is a Mac, `platform.mac_ver()` is the
    # real release string rather than a stand-in, and the two frameworks are
    # really on disk for `_macapi` to dlopen. A transcription error in the
    # ctypes binding -- the likeliest way this code is wrong -- shows up here
    # and nowhere else, because a fake never sees it.
    #
    # Promoted to a gate, by `windows`' route: the suite step below was run on a
    # real Mac first -- a macOS 26.7 VM, with the Accessibility and PostEvent
    # grants made by hand for the occasion -- where it came back 1816 tests, 33
    # skips, no failures, clearing both floors. docs/validation.md records that
    # run. Dropped with the promotion: `continue-on-error`, which is what kept a
    # red macOS job from reddening somebody else's pull request while nobody had
    # watched this file pass.
    #
    # The probe step after it is deliberately not part of that evidence. It
    # asserts what `detect()` makes of a real Darwin host and that the four
    # TCC preflights answer at all rather than raising out of a mistyped
    # binding -- plus that `can_capture` and `can_inject_input` follow the two
    # grants they are documented to follow, whichever way those read on the
    # day. Not the grants themselves: this runner reports PostEvent as granted
    # while granting nothing a person would recognise, so a job that required
    # four `False` answers was pinning GitHub's image into the suite. What
    # each grant does to those answers is recorded in docs/validation.md.
    #
    # One caution, recorded in the same place rather than left implicit: that
    # Mac is not this runner. It is 3.13 where this job pins 3.12, x86_64 where
    # the runner is arm64, and granted where the runner grants nothing -- so it
    # exercises `tests/test_macos.py`'s live class, which the runner skips. A
    # green run here is still the only thing that has watched the Darwin branch
    # of `detect()` answer on a machine whose `sys.platform` is really Darwin.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # One version rather than the matrix, same as `windows`: this job is
          # about the platform, and Python-to-Python differences are `tests`'.
          python-version: "3.12"

      - name: Run the suite, and check that the other platforms skipped
        env:
          PYTHONPATH: src
        run: |
          set -eo pipefail
          python - <<'PY'
          import sys
          import unittest

          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.TestLoader().discover("tests")
          )
          skipped = len(result.skipped)
          print(
              f"\nran {result.testsRun}, skipped {skipped}, "
              f"failures {len(result.failures)}, errors {len(result.errors)}"
          )
          if result.failures or result.errors:
              sys.exit(1)
          # A floor rather than a target: a mass import failure would otherwise
          # look like a suite that quietly ran almost nothing.
          if result.testsRun < 800:
              sys.exit(f"only {result.testsRun} tests ran -- something did not import")
          # The X11, AT-SPI, D-Bus, portal and Windows tests have to skip
          # *loudly* on a Mac, same as their Linux and Windows counterparts do
          # elsewhere. Zero skips would mean the guards never fired, which
          # reads as support for a platform that was not tested at all.
          if skipped < 10:
              sys.exit(f"only {skipped} tests skipped -- the guards did not run")
          PY

      # The one step only a Mac can run. `detect()` has to answer before the
      # `macos` extra is installed -- that is the whole reason the four TCC
      # preflights are ctypes in `_macapi` rather than PyObjC -- so this
      # installs nothing, and every assertion below is about what this package
      # derives from the machine's answers rather than about what those
      # answers are.
      - name: Check what detect() says on a real Mac
        env:
          PYTHONPATH: src
        run: |
          set -eo pipefail
          python - <<'PY'
          import platform
          import sys

          import pyguitest
          from pyguitest import Compositor, SessionType
          from pyguitest.backends import _macapi

          env = pyguitest.detect()
          print(f"host: macOS {platform.mac_ver()[0]}, python {sys.version.split()[0]}")
          print(env.summary())

          # Platform-first classification is why a Mac with XQuartz's DISPLAY
          # set is not typed as X11. A runner may well have DISPLAY unset, so
          # this reaches the branch rather than every input to it.
          if env.session_type is not SessionType.DARWIN:
              sys.exit(f"expected DARWIN, got {env.session_type}")
          if env.compositor is not Compositor.QUARTZ:
              sys.exit(f"expected QUARTZ, got {env.compositor}")

          # The way this half of the work breaks is a transcription error -- a
          # framework path or an argtypes list that is wrong -- and that
          # arrives as a *raise*. So a raise is what fails here, reported with
          # the probe's name attached: an exception left to escape came out as
          # a traceback that named neither the probe it came from nor the
          # ctypes binding as the cause, which is the one thing worth saying.
          #
          # What is deliberately *not* asserted is the polarity. This job used
          # to require all four to be False, on the reasoning that a runner
          # grants nothing -- and this runner answers True for PostEvent, so
          # that was a claim about GitHub's image rather than about pyguitest,
          # and it broke when the image changed rather than when the code did.
          grants = {}
          for name in (
              "screen_recording_allowed",
              "post_event_allowed",
              "listen_event_allowed",
              "accessibility_trusted",
          ):
              try:
                  grants[name] = getattr(_macapi, name)()
              except Exception as error:
                  sys.exit(f"{name}() raised {error!r}: the binding, not the grant")
              print(f"{name}() -> {grants[name]}")

          # The derivation is the part that is ours, and it holds whatever the
          # machine granted: on Darwin both of these read exactly one
          # preflight -- and the *right* one, which is the mistake worth
          # catching here. Reading has_ax for input, or capture_tools for
          # capture, would refuse on a Mac that had granted precisely what the
          # call needs, and a `screencapture` that ships with every Mac makes
          # the tool-shaped answer look right while being wrong.
          if env.can_capture != grants["screen_recording_allowed"]:
              sys.exit(
                  f"can_capture is {env.can_capture} with Screen Recording "
                  f"{grants['screen_recording_allowed']}"
              )
          if env.can_inject_input != grants["post_event_allowed"]:
              sys.exit(
                  f"can_inject_input is {env.can_inject_input} with PostEvent "
                  f"{grants['post_event_allowed']}"
              )

          # `screencapture` ships with the OS, so its absence means `tools.py`
          # is naming something that is not there.
          if "screencapture" not in env.capture_tools:
              sys.exit(f"screencapture missing from {env.capture_tools}")

          # And the refusal that keeps a denied Screen Recording grant from
          # producing a black PNG with an exit status of 0. Called directly,
          # the way tests/test_macos.py does: the guard is keyed by tool name
          # in `_PERMISSION_GATES` and only fires on the `screencapture` path,
          # so reaching it here would mean standing up a capture backend too.
          from pyguitest.backends import capture
          from pyguitest.errors import PermissionRequired

          try:
              capture.require_screen_recording()
          except PermissionRequired as error:
              if grants["screen_recording_allowed"]:
                  sys.exit(f"refused with the grant held: {error}")
              print(f"refused before running: {error}")
          else:
              if not grants["screen_recording_allowed"]:
                  sys.exit("screencapture was not refused without the grant")
              print("allowed through, which is what the grant means")
          PY

      # Last, so the probe above runs on the machine as CI finds it rather
      # than on one with PyObjC already installed. This proves the extras
      # markers resolve *on Darwin* -- they carry `sys_platform == 'darwin'`,
      # and a marker that quietly excluded macOS would otherwise surface only
      # as a packaging bug after release.
      - name: The macos extra installs, and macquartz appears with it
        env:
          PYTHONPATH: src
        run: |
          set -eo pipefail
          pip install '.[macos]'
          python - <<'PY'
          import sys

          import ApplicationServices  # noqa: F401
          import Quartz  # noqa: F401

          import pyguitest
          from pyguitest import SessionType

          if pyguitest.detect().session_type is not SessionType.DARWIN:
              sys.exit("detect() changed its mind once PyObjC was installed")
          if "macquartz" not in pyguitest.backends.available():
              sys.exit(f"macquartz missing from {pyguitest.backends.available()}")
          # That listing is platform-blind on purpose -- it names every
          # registered backend whether or not its imports resolve -- so it
          # cannot fail for the reason this step exists, and would have stayed
          # green with the `macos` extra uninstalled. The backend's own
          # `available()` is the importability probe, and a `sys_platform`
          # marker that quietly excluded macOS is the thing it catches.
          from pyguitest.backends import macquartz

          if not macquartz.available():
              sys.exit("macquartz is registered but its PyObjC imports do not resolve")
          # opt_in means the request is made by a caller naming the backend,
          # never by composition, so nothing above has asked for a grant -- and
          # per macquartz.request_post_event, asking shows no dialog on a Mac,
          # so nothing here is waiting on a click either.
          print("macos extra installed; PyObjC imported; macquartz registered")
          PY

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install build twine
      - run: python -m build

      # A PyPI version number can never be reused, so a tag disagreeing with
      # the packaged version has to fail here rather than ship. Read back out
      # of the built artifact, not out of the source, so it checks what would
      # actually be uploaded. Skipped on branch pushes, where there is no tag.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/pyguitest-(.+)\.tar\.gz|\1|')
          echo "tag=$tag packaged=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the packaged"
            echo "::error::version $built -- fix __version__ in"
            echo "::error::src/pyguitest/__init__.py or retag."
            exit 1
          fi

      # Catches a README that renders on GitHub but not on PyPI, which is
      # otherwise only discovered once the upload is already permanent.
      - run: python -m twine check --strict dist/*

      # The sdist ships tests/, and tests/test_docs.py reads docs/install.md
      # and docs/input.md -- so a packager building from the sdist and running
      # the suite, which is what Fedora and Debian do, needs docs/ inside it.
      # That is what MANIFEST.in is for; this asserts it kept working.
      - name: The sdist must be self-testing
        run: |
          set -eu
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/pyguitest-*
          PYTHONPATH=src python -m unittest discover -s tests -v

      # Handed to the publish job below rather than rebuilt there, so what
      # reaches PyPI is byte-for-byte what twine just checked.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishes to PyPI on a v* tag via Trusted Publishing (OIDC): PyPI is
  # configured to trust this repo/workflow/environment, so there is no API
  # token in secrets to leak or rotate. `id-token: write` is what lets the
  # runner mint the short-lived credential; the action does the rest.
  #
  # Requires one-time setup on pypi.org first -- see "Releasing" in
  # CONTRIBUTING.md. Until that exists, a tag push fails here rather than
  # silently publishing nothing.
  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    # `windows` is in here because a release that cannot be imported on
    # Windows is exactly what shipped once already: 0.10.1 carries a
    # module-scope `import grp`, so `import pyguitest` raises there, and no
    # gate said so at publish time.
    needs: [tests, lint, imagemagick, portal, compositor, windows, macos, build]
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI publisher config. A
    # required reviewer on it makes each publish a deliberate approval
    # rather than a side effect of pushing a tag.
    environment:
      name: pypi
      url: https://pypi.org/p/pyguitest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
